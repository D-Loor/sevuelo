<div class="row justify-content-center">
    <div class="col-8">
        <h3>Create a new Request</h3>

        <form [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group">
                <label for="passenger">Passenger:</label>
                <input type="text" id="passenger" class="form-control" formControlName="passenger"
                    placeholder="Passenger" />
                <div *ngIf="form.controls['passenger'].invalid && form.controls['passenger'].touched"
                    class="alert alert-danger">
                    Passenger is required
                </div>
            </div>

            <div class="form-group">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" class="form-control" formControlName="destination"
                    placeholder="Destination" />
                <div *ngIf="form.controls['destination'].invalid && form.controls['destination'].touched"
                    class="alert alert-danger">
                    Destination is required
                </div>
            </div>

            <button type="button" (click)="previousState()" class="btn btn-info">
                 Back
            </button>

            <button type="submit" class="btn btn-success" [disabled]="form.invalid">
                Save
            </button>

        </form>
    </div>
</div>
